# Builds and tests Transcriber for Windows on every push to main and on pull requests, and
# builds the installers for release.yml. It doesn't publish anything itself.
#
# Two variants: "gpu" runs Whisper on the GPU through Vulkan (Intel, AMD and NVIDIA), "cpu" works everywhere.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [gpu, cpu]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.variant }}

      # The SDK is only needed to build; the app uses the Vulkan driver that comes with the graphics driver.
      - name: Install the Vulkan SDK
        if: matrix.variant == 'gpu'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\vulkan_sdk.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" -OutFile $installer
          $root = "C:\VulkanSDK"
          Start-Process -FilePath $installer -Wait -NoNewWindow -ArgumentList `
            "--root", $root, "--accept-licenses", "--default-answer", "--confirm-command", "install"
          if (-not (Test-Path "$root\Include\vulkan\vulkan.h")) { throw "The Vulkan SDK didn't install." }
          "VULKAN_SDK=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$root\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # whisper.cpp builds its Vulkan shader generator as a nested CMake project. With the Visual Studio
      # generator on the current runners that nested project can't find the compiler, so build with
      # Ninja inside a Visual Studio developer environment instead.
      - name: Set up the MSVC developer environment
        if: matrix.variant == 'gpu'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Use Ninja for CMake
        if: matrix.variant == 'gpu'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          ninja --version
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - run: npm ci

      # The Rust side embeds the built interface, so build it before Rust compiles.
      - run: npm run build

      - name: Unit tests
        if: matrix.variant == 'cpu'
        run: cargo test
        working-directory: src-tauri

      - name: Build installers
        shell: bash
        run: npx tauri build ${{ matrix.variant == 'gpu' && '--features vulkan' || '' }}

      # Both variants produce the same file names, so add the variant to them.
      - name: Name the installers
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          for f in nsis/*-setup.exe; do mv "$f" "${f%-setup.exe}_${{ matrix.variant }}-setup.exe"; done
          for f in msi/*.msi; do mv "$f" "$(echo "$f" | sed -E 's/_x64_/_x64_${{ matrix.variant }}_/')"; done
          ls -l nsis msi

      - uses: actions/upload-artifact@v4
        with:
          name: Transcriber-windows-${{ matrix.variant }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
