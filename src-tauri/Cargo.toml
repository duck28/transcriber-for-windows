[package]
name = "transcriber"
version = "1.3.0"
description = "Transcriber for Windows: on-device transcription"
edition = "2021"

[lib]
name = "transcriber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
whisper-rs = "0.16"
symphonia = { version = "0.6", features = ["all-codecs", "all-formats"] }
hound = "3.5"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "fs"] }
dirs = "6"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
trash = "5"

[features]
# GPU acceleration for Whisper through Vulkan (needs the Vulkan SDK at build time).
vulkan = ["whisper-rs/vulkan"]

[profile.release]
opt-level = 3
lto = "thin"
